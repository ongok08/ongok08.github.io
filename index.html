<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jus Buah Segar — UMKM Jus Buah</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#fffdf7;color:#183b20;line-height:1.6}
nav{position:sticky;top:0;z-index:20;background:#fffdf7ee;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 6%;border-bottom:1px solid #e8e4d2}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#183b20;font-weight:800}
.brand img{width:75px;height:58px;object-fit:contain}
.links a{color:#183b20;text-decoration:none;margin:0 12px;font-weight:700}
.order{background:#f68b08;color:#fff!important;padding:12px 19px;border-radius:12px;box-shadow:0 7px 18px #f68b0830}
.hero{padding:65px 6%;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;background:linear-gradient(120deg,#fff9df,#eff9df);overflow:hidden}
.hero h1{font-size:clamp(44px,6vw,76px);line-height:.98;margin:12px 0;color:#174d22}
.hero h1 span{color:#f58b05}
.tag{display:inline-block;padding:8px 15px;border-radius:30px;background:#fff;border:1px solid #dce7c7;color:#4b8e20;font-weight:800}
.hero h2{font-size:28px;color:#28752d;margin-bottom:12px}
.hero p{max-width:600px;color:#536052;font-size:18px;margin-bottom:25px}
.cta{display:inline-block;background:#5b9f1d;color:white;text-decoration:none;padding:13px 23px;border-radius:12px;font-weight:800}
.hero-visual{display:flex;justify-content:center}
.juice-row{display:flex;align-items:end;justify-content:center;gap:10px;flex-wrap:wrap;max-width:590px}
.glass{width:105px;height:220px;border-radius:14px 14px 30px 30px;background:linear-gradient(#fff8,#fff2),linear-gradient(#f04,#f90);border:5px solid #fff;box-shadow:0 15px 25px #3d572025;position:relative;overflow:hidden}
.glass:nth-child(1){background:linear-gradient(#ffffff22,#ffffff22),#ef5360}
.glass:nth-child(2){background:linear-gradient(#ffffff22,#ffffff22),#f28b0b}
.glass:nth-child(3){background:linear-gradient(#ffffff22,#ffffff22),#f6a70a}
.glass:nth-child(4){background:linear-gradient(#ffffff22,#ffffff22),#68a92a}
.glass:nth-child(5){background:linear-gradient(#ffffff22,#ffffff22),#91b82d}
.glass:nth-child(6){background:linear-gradient(#ffffff22,#ffffff22),#f4bb44}
.glass:after{content:"";position:absolute;left:0;right:0;top:18px;height:8px;background:#ffffff88;border-radius:50%}
.menu{padding:70px 6%;background:#fff}
.title{text-align:center;margin-bottom:35px}
.title h2{font-size:40px;color:#174d22} .title h2 span{color:#f58b05}
.title p{color:#687266}
.grid{max-width:1150px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:#fff;border:1px solid #ece7d8;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #3d572012;transition:.2s}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:180px;display:block;object-fit:cover}
.card-body{padding:18px}
.card h3{font-size:21px;margin-bottom:4px} .card p{color:#687266;font-size:14px}
.price{margin-top:10px;color:#f58b05;font-size:20px;font-weight:900}
.about{padding:70px 6%;background:#f0f8e7}
.features{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feature{background:#fff;padding:25px;border-radius:18px;text-align:center;border:1px solid #e1ebd5}
.feature .icon{font-size:38px} .feature b{display:block;margin:7px 0} .feature p{color:#687266}
.contact{padding:70px 6%;text-align:center;background:#fff7dc}
footer{background:#173b20;color:#fff;padding:28px 6%;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer small{color:#d9e8d5}
@media(max-width:800px){
 nav{padding:8px 4%} .brand img{width:65px} .links a:not(.order){display:none}
 .hero{grid-template-columns:1fr;text-align:center;padding:48px 5%} .hero p{margin-left:auto;margin-right:auto}
 .juice-row{gap:6px} .glass{width:70px;height:150px}
 .grid,.features{grid-template-columns:1fr} .card img{height:210px}
 section{padding-left:5%;padding-right:5%}
}

/* Background buah-buahan */
body {
  background-color: #fffdf7;

    radial-gradient(circle at 8% 18%, rgba(245,139,5,.10) 0 42px, transparent 43px),

  background-size:260px 260px;

  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .075;
  font-size: 42px;
  line-height: 2.8;
  letter-spacing: 28px;
  word-spacing: 20px;
  transform: rotate(-8deg) scale(1.15);
  overflow: hidden;
}
.hero {
  background:
    linear-gradient(120deg, rgba(255,249,223,.96), rgba(239,249,223,.92)),
    radial-gradient(circle at 85% 35%, rgba(245,139,5,.20), transparent 28%);
}
.menu {
  background: rgba(255,255,255,.94);
}
.about {
  background:
    linear-gradient(rgba(240,248,231,.94), rgba(240,248,231,.94)),
    radial-gradient(circle at 15% 25%, rgba(91,159,29,.15), transparent 25%);
}
.contact {
  background:
    linear-gradient(rgba(255,247,220,.95), rgba(255,247,220,.95)),
    radial-gradient(circle at 85% 40%, rgba(245,139,5,.18), transparent 28%);
}


.fruit-strip {
  position: fixed;
  top: 74px;
  left: 0;
  width: 100%;
  z-index: 2;
  text-align: center;
  font-size: 24px;
  letter-spacing: 16px;
  opacity: .18;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
}
@media(max-width:800px) {
  .fruit-strip { top: 65px; font-size: 18px; letter-spacing: 8px; }
}

</style>
